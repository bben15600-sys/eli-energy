name: Security dependency floor

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  patched-versions:
    name: next and sharp stay patched
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail if next or sharp drop below the patched versions
        run: npm run check:security-deps
